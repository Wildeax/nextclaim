appId: com.moodstudios.autoclaimer
productName: Auto Claimer
directories:
  output: dist
files:
  - ui/**/*
  - assets/**/*
  - package.json
  - "!free-games-claimer/.git*"
  - "!free-games-claimer/data/**"
asarUnpack:
  - "node_modules/electron-store/**/*"
extraResources:
  - from: free-games-claimer
    to: free-games-claimer
    filter:
      - "**/*"
      - "!.git*"
      - "!data/**"
  - from: "C:/Users/GAMER/AppData/Local/ms-playwright/firefox-1482"
    to: playwright-browsers/firefox-1482
win:
  target: zip
  icon: assets/installer-icon.ico
  artifactName: AutoClaimer-${version}.zip
