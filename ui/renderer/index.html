<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NextClaim</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="welcome" class="hidden"></div>
  <div id="dashboard" class="hidden">
    <header class="app-header">
      <img class="app-logo" src="../../assets/isotipo.png" alt="NextClaim" />
      <div class="app-title">
        <h1>NextClaim</h1>
        <div class="app-subtitle" id="header-subtitle">Loading…</div>
      </div>
      <div class="header-actions">
        <button id="claim-now" class="btn btn-primary">
          <span class="btn-icon">▶</span>
          <span>Claim now</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">Stores</span>
          <span class="panel-sub" id="stores-sub"></span>
        </div>
        <div id="store-cards" class="store-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">Recent claims</span>
          <span class="panel-sub" id="history-sub"></span>
        </div>
        <div id="history-content" class="history-list">
          <div class="empty">No games claimed yet.</div>
        </div>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <span class="panel-title">Live log</span>
          <button id="clear-log" class="btn btn-ghost btn-sm">Clear</button>
        </div>
        <pre id="log-content"></pre>
      </section>
    </main>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
